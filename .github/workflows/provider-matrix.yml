name: Provider adapter regression matrix

on:
  pull_request:
    paths:
      - "modules/ai_scanner/**"
      - "modules/guardrail_lab/**"
      - "tests/**"
      - ".github/workflows/provider-matrix.yml"
  push:
    branches: [main]
    paths:
      - "modules/ai_scanner/**"
      - "modules/guardrail_lab/**"
      - "tests/**"
      - ".github/workflows/provider-matrix.yml"

permissions:
  contents: read

jobs:
  provider-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OMJB optional API dependencies
        run: python -m pip install -e '.[api]'
      - name: Run complete offline regression suite
        run: python -m unittest discover -s tests -v
